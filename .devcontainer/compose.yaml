name: ecommerce-development

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    working_dir: /workspaces/e-commerce
    env_file:
      - ../.env.development
    environment:
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venvs/e-commerce-server
    volumes:
      - ..:/workspaces/e-commerce:cached
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - ../.env.development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
