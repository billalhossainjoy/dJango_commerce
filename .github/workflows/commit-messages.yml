name: Commit messages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate new commits
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install commit validation tools
        run: uv sync --project server --locked --only-group dev

      - name: Validate new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            revision_range="$merge_base..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            merge_base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"

            if [[ "$merge_base" == "$HEAD_SHA" ]]; then
              root_commit="$(git rev-list --max-parents=0 "$HEAD_SHA")"

              if [[ "$root_commit" == "$HEAD_SHA" ]]; then
                revision_range="$HEAD_SHA"
              else
                revision_range="$root_commit..$HEAD_SHA"
              fi
            else
              revision_range="$merge_base..$HEAD_SHA"
            fi
          else
            revision_range="$BEFORE_SHA..$HEAD_SHA"
          fi

          echo "Validating commits in $revision_range"
          uv run --project server --no-sync cz check \
            --message-length-limit 72 \
            --rev-range "$revision_range"
