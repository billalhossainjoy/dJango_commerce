name: Application quality

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir client install --frozen-lockfile

      - name: Check frontend lint
        run: pnpm --dir client lint

      - name: Build frontend
        run: pnpm --dir client build

  backend:
    name: Backend tests and quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENVIRONMENT: test
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce
      DATABASE_CONN_MAX_AGE: "0"
      DEBUG: "false"
      DJANGO_SECRET_KEY: github-actions-test-only
      ALLOWED_HOSTS: testserver,localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install backend dependencies
        run: uv sync --project server --locked

      - name: Check Python lint
        run: uv run --project server ruff check server

      - name: Check Python formatting
        run: uv run --project server ruff format --check server

      - name: Check Python types
        run: uv run --project server mypy --config-file server/pyproject.toml server

      - name: Check Django configuration
        run: uv run --project server python server/manage.py check

      - name: Check for missing migrations
        run: >
          uv run --project server python server/manage.py
          makemigrations --check --dry-run

      - name: Run backend tests
        run: uv run --project server pytest server
