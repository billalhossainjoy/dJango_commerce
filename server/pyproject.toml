[project]
name = "e-commerce-server"
version = "0.1.0"
description = "Django API for the e-commerce application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1",
    "django-environ==0.12.0",
    "djangorestframework==3.18.0",
    "psycopg[binary]==3.3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]