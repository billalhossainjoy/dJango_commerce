[project]
name = "e-commerce-server"
version = "0.1.0"
description = "Django API for the e-commerce application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1",
    "django-cors-headers>=4.9,<5",
    "django-environ==0.12.0",
    "djangorestframework==3.18.0",
    "psycopg[binary]==3.3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "django-stubs>=5.2.9",
    "djangorestframework-stubs>=3.16.6",
    "mypy>=1.18.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "accounts", "tenancy"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.14"
files = ["."]
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
exclude = [".*/migrations/.*"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true
strict_model_abstract_attrs = true

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true
