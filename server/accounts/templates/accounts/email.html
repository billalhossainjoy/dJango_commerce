<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#0f172a;padding:32px 16px">
    <main style="max-width:560px;margin:auto;background:white;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
      <p style="font-size:13px;color:#4f46e5;font-weight:bold">STOCKFARE</p>
      <h1 style="font-size:24px;line-height:1.3">{{ subject }}</h1>
      <div style="font-size:15px;line-height:1.7;color:#475569">{{ body|linebreaksbr }}</div>
      {% if action_url %}
      <p style="margin-top:28px"><a href="{{ action_url }}" style="display:inline-block;background:#4f46e5;color:white;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">{{ action_label }}</a></p>
      {% endif %}
      <p style="margin-top:28px;font-size:12px;color:#64748b">Sent by Stockfare.</p>
    </main>
  </body>
</html>
